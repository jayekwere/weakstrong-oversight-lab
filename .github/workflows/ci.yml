name: Verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.7
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - run: uv run --frozen ruff check . && uv run --frozen ruff format --check .
      - run: uv run --frozen mypy
      - run: uv run --frozen pytest
      - run: node --test tests/dashboard.test.mjs
      - run: uv run --frozen bandit -q -r src
      - run: uv run --frozen python scripts/verify_content.py
      - run: uv build --no-sources
      - run: uv run --frozen python scripts/reproduce.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-${{ matrix.python }}
          path: |
            coverage.json
            runs/reproduced.json
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.7
      - run: uv sync --frozen --extra dev
      - run: uv export --frozen --no-emit-project --all-extras --no-header --no-annotate --output-file runs/runtime-requirements.txt
      - run: uv run --frozen pip-audit -r runs/runtime-requirements.txt --require-hashes --disable-pip
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build -t research-lab:ci .
      - run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --pids-limit 64 --memory 512m
          --tmpfs /tmp:rw,noexec,nosuid,size=64m research-lab:ci
          run --output /tmp/result.json
