[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[project]
name = "weakstrong-oversight-lab"
version = "0.1.0"
description = "Capability-calibrated model supervision; reproducible synthetic AI safety research"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["fastapi>=0.120,<1", "pydantic>=2.12,<3", "httpx>=0.28,<1", "uvicorn>=0.38,<1"]
[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "pytest-cov>=7,<8", "ruff>=0.14,<1", "mypy>=1.18,<3", "bandit>=1.8,<2", "pip-audit>=2.9,<3", "detect-secrets>=1.5,<2"]
[project.scripts]
weakstrong-oversight-lab = "weakstrong.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/weakstrong"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=weakstrong --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=85"
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["weakstrong"]
mypy_path = "src"
[tool.coverage.run]
branch = true
source = ["weakstrong"]
